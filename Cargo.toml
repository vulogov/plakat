[package]
name = "plakat"
version = "0.1.0"
edition = "2024"
description = "Local text-to-image and style-reference image generation CLI"
license = "MIT"

[features]
# No backend selected by default — user picks one at build time.
#   macOS:        cargo build --release --features metal
#   Linux+NVIDIA: cargo build --release --features cuda
#   Anywhere:     cargo build --release --features cpu
default = []
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
# CLI / UX
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
anyhow = "1"
thiserror = "1"

# Async + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Image
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# RNG (only for cases where we want a host-side seed)
rand = "0.8"

# Hugging Face Hub
hf-hub = { version = "0.4", features = ["tokio"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Candle (inference)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"

# Paths / tempfiles
directories = "5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
