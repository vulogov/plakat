# Release builds for plakat.
#
# Triggers:
#   * push of a `v*` tag (`git tag v0.8.0 && git push origin v0.8.0`)
#   * manual via the Actions → Release → "Run workflow" button.
#
# What it does:
#   1. Builds the `plakat` binary on five host targets in parallel.
#   2. Strips the binary, archives it with LICENSE + README + assets/.
#   3. Computes SHA256SUMS.
#   4. Attaches every archive + the checksum file to the GitHub release
#      named after the tag (creating it as a draft if it doesn't exist
#      yet — for tag pushes — so you can review before publishing).
#
# Backend feature flags per target:
#   * aarch64-apple-darwin  → `--features metal` (Apple Silicon GPU)
#   * everything else       → default features (CPU-only build)
#
# CUDA builds are not produced here. They require the CUDA toolkit
# installed on the runner, which is left to a future, separately-
# gated job (or to the user via `cargo install plakat --features cuda`).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.7.0). Creates a draft release if absent."
        required: true
        type: string

permissions:
  contents: write  # needed to create/upload to releases

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reproducible-ish builds: pin codegen-units / stripping at the
  # workflow level rather than per-target.
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  # =====================================================================
  # Build per-target.
  # =====================================================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            features: ""
            archive: tar.gz
            bin_suffix: ""

          # CUDA-enabled x86_64 Linux build. Dynamically links
          # libcudart.so etc., so users without an NVIDIA stack
          # should grab the plain x86_64-unknown-linux-gnu archive
          # instead. CUDA toolkit is installed at build time via
          # Jimver/cuda-toolkit on a stock ubuntu-22.04 runner.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            features: "cuda"
            archive: tar.gz
            bin_suffix: ""
            name_suffix: "-cuda"
            install_cuda: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            features: ""
            archive: tar.gz
            bin_suffix: ""
            # Cross-compile via the system gcc-aarch64-linux-gnu toolchain.
            cross_linux: true

          # x86_64-apple-darwin (Intel Mac) is intentionally not built.
          # GitHub-hosted macos-13 runners are scarce and Apple Silicon
          # is the supported target for plakat (Metal backend, the only
          # GPU path on macOS). Users on Intel Macs can still build from
          # source with `cargo install plakat`.

          - target: aarch64-apple-darwin
            runner: macos-14
            features: "metal"
            archive: tar.gz
            bin_suffix: ""

          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            features: ""
            archive: zip
            bin_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          # Include features in the key so the CUDA build doesn't
          # collide with the plain x86_64-linux-gnu CPU build (both
          # share `target` but have different dep graphs).
          key: ${{ matrix.target }}-${{ matrix.features }}
          shared-key: release

      # -----------------------------------------------------------------
      # Linux cross-compile prerequisites (aarch64 only).
      # -----------------------------------------------------------------
      # v0.22 broke the previously-C-free dep graph: rust_dynamic 0.49
      # → neurons → plotters (default features) → font-kit →
      # yeslogic-fontconfig-sys. The build script wants a fontconfig
      # sysroot for the cross target; we install libfontconfig1-dev:arm64
      # via dpkg multiarch and point pkg-config at it.
      #
      # GH-hosted Ubuntu runners default their apt sources to amd64
      # only, so we have to splice in the ports.ubuntu.com mirror for
      # arm64 before `apt-get install :arm64` will find anything.
      - name: Install aarch64 Linux cross toolchain
        if: matrix.cross_linux
        run: |
          # v0.31.0 phase 4 (third attempt): wholesale replacement of
          # Ubuntu apt sources. Earlier attempts (v0.29.1 single-mirror
          # mirrorlist, v0.31.0 `Architectures: amd64` rewrite) didn't
          # fully stop apt from probing arm64 against amd64-only
          # mirrors. The recurring issue: `Architectures:` on the
          # DEB822 source doesn't restrict `mirror+file:` URI fan-out,
          # so `dpkg --add-architecture arm64` re-triggers arm64
          # probes against every URL the mirrorlist resolves to.
          #
          # New strategy — bypass the runner image's source files
          # entirely:
          #
          # 1. Delete any `.sources` file in /etc/apt/sources.list.d/
          #    that uses `mirror+file:` URIs (catches ubuntu.sources
          #    and any siblings with the same shape).
          # 2. Delete any `mirror+file:` reference from .list files.
          # 3. Restrict every remaining .list file to amd64 via
          #    `[arch=amd64]` (catches azure-cli, google-chrome, etc.).
          # 4. Restrict /etc/apt/sources.list (legacy global) to amd64.
          # 5. Write OUR explicit amd64 sources via a new
          #    /etc/apt/sources.list.d/ubuntu-amd64.list pointing at
          #    azure.archive.ubuntu.com (fast from Azure runners).
          # 6. Add explicit arm64 sources via /etc/apt/sources.list.d/
          #    arm64.list pointing at ports.ubuntu.com.
          # 7. dpkg --add-architecture arm64; apt-get update.
          #
          # Net effect: deterministic source layout, no apt-mirrors.txt
          # in the picture, no DEB822 sources, no mirror+file: URIs.
          # Idempotent on rerun.

          # Step 1: delete .sources files that use mirror+file.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if sudo grep -q 'mirror+file' "$f"; then
              echo "removing $f (uses mirror+file:)"
              sudo rm "$f"
            fi
          done

          # Step 2 + 3: lock remaining .list sources to amd64. The
          # `[arch=amd64]` qualifier IS honoured by apt for `.list`
          # sources (unlike DEB822 mirror+file:).
          restrict_list_to_amd64() {
            local f="$1"
            # Strip any pre-existing [arch=...] qualifier, then
            # re-inject [arch=amd64]. Idempotent.
            sudo sed -i -E \
              -e 's|^(deb(-src)?) \[arch=[^]]*\] |\1 |g' \
              -e 's|^(deb(-src)?) (https?)|\1 [arch=amd64] \3|g' "$f"
          }
          [ -f /etc/apt/sources.list ] && restrict_list_to_amd64 /etc/apt/sources.list
          for f in /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] && restrict_list_to_amd64 "$f"
          done

          # Step 4: also nuke the mirrorlist file itself if present —
          # it has no consumers left after step 1, but leaving it
          # around invites a future runner-image source file to start
          # using it again.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo rm /etc/apt/apt-mirrors.txt
          fi

          # Step 5: explicit amd64 source. azure.archive.ubuntu.com is
          # the Azure-runner-local mirror — fast intra-DC.
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.list > /dev/null <<'EOF'
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
          EOF

          # Step 6: explicit arm64 source via ports.ubuntu.com (the
          # only mirror that hosts non-x86 Ubuntu binaries).
          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config \
            libfontconfig1-dev:arm64
          # Tell cargo which linker to use for the aarch64 target.
          # PKG_CONFIG_* vars route fontconfig discovery at the arm64
          # multiarch path (no separate sysroot — multiarch layouts
          # leave headers/libs under /usr/{include,lib}/aarch64-linux-gnu/).
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS_aarch64_unknown_linux_gnu=1"
            echo "PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=/"
          } >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # CUDA toolkit (cuda matrix entry only). ~3-4 GB on disk; fits
      # within the GitHub-hosted Linux runner's 14 GB budget.
      # NVCC compilation extends the build time considerably.
      # -----------------------------------------------------------------
      - name: Install CUDA toolkit (nvcc + cudart)
        if: matrix.install_cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "12.4.0"
          # nvcc + cudart are what candle-cuda links against; skip
          # the heavyweight samples + docs. cublas is intentionally
          # NOT requested here — on CUDA 12.x the Jimver action still
          # asks apt for `cuda-cublas-12-4`, but NVIDIA renamed that
          # package to `libcublas-12-4` in the 12.x repos, so the
          # install fails. We install it manually below with the
          # correct names.
          method: "network"
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'

      - name: Install cuBLAS + cuRAND + NVRTC (apt — correct names for CUDA 12.x)
        if: matrix.install_cuda
        # candle-cuda's linker spec is `-lcuda -lnvrtc -lcurand -lcublas
        # -lcublasLt -lcudart`. cudart comes from the Jimver action above.
        # libcuda.so is the driver and is shipped as a stub by the toolkit
        # (in lib64/stubs), so we don't need it from apt. The remaining
        # libs split across two package families in NVIDIA's repos: the
        # math libraries use the `lib*` prefix (cuBLAS, cuRAND), while
        # NVRTC ships under the `cuda-*` prefix.
        run: |
          sudo apt-get install -y \
            libcublas-12-4 \
            libcublas-dev-12-4 \
            libcurand-12-4 \
            libcurand-dev-12-4 \
            cuda-nvrtc-12-4 \
            cuda-nvrtc-dev-12-4

      - name: Verify CUDA install
        if: matrix.install_cuda
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          nvcc --version
          ls "$CUDA_PATH/lib64/" | head -20
          # Confirm libcublas got installed where candle-cuda will
          # find it (apt puts it under /usr/lib/x86_64-linux-gnu).
          ls /usr/lib/x86_64-linux-gnu/libcublas* 2>/dev/null || true

      # -----------------------------------------------------------------
      # Build.
      # -----------------------------------------------------------------
      - name: Build (default features)
        if: matrix.features == ''
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (--features ${{ matrix.features }})
        if: matrix.features != ''
        shell: bash
        # CUDA_COMPUTE_CAP is consumed by candle-kernels' bindgen_cuda
        # crate at build time. Without it bindgen_cuda runs nvidia-smi
        # to auto-detect the host GPU's compute cap — which panics on
        # a GitHub Actions Linux runner because there is no GPU and no
        # nvidia-smi. 80 = Ampere (A100, A40, RTX 30xx). The compiled
        # kernels embed PTX, so newer archs (Ada Lovelace 89, Hopper 90,
        # Blackwell 100) JIT forward at runtime. Older Turing (75) is
        # not supported by this binary — users on T4 / RTX 20xx should
        # stick with the CPU build or `cargo install` from source with
        # CUDA_COMPUTE_CAP=75 set.
        env:
          CUDA_COMPUTE_CAP: ${{ matrix.install_cuda && '80' || '' }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --features '${{ matrix.features }}'

      # -----------------------------------------------------------------
      # Strip + smoke-test (skip --version on cross-compiled aarch64
      # since the runner can't execute the binary).
      # -----------------------------------------------------------------
      - name: Strip binary
        if: runner.os != 'Windows' && !matrix.cross_linux
        shell: bash
        run: |
          strip "target/${{ matrix.target }}/release/plakat${{ matrix.bin_suffix }}"

      # CUDA-feature builds dynamically link `libcuda.so.1` (the NVIDIA
      # driver shim), which is shipped by the driver — NOT the toolkit.
      # GitHub-hosted runners install the SDK but have no GPU and no
      # driver, so the binary fails to load before it can print --version.
      # The binary is correct for any host that does have NVIDIA drivers;
      # we just can't validate it here. (candle 0.10 resolves libcuda
      # eagerly at startup, which is what newly tripped this in v0.17.)
      - name: Smoke-test --version
        if: '!matrix.cross_linux && !contains(matrix.features, ''cuda'')'
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/plakat${{ matrix.bin_suffix }}" --version

      # -----------------------------------------------------------------
      # Stage release contents.
      # -----------------------------------------------------------------
      - name: Stage release directory
        id: stage
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # name_suffix is empty for default builds; "-cuda" for the
          # CUDA-enabled Linux matrix entry. Lets two matrix rows
          # share `target` without colliding on archive name.
          name="plakat-${tag}-${{ matrix.target }}${{ matrix.name_suffix }}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/plakat${{ matrix.bin_suffix }}" "${stage}/"
          cp LICENSE README.md "${stage}/"
          cp -R assets "${stage}/assets"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "dir=${stage}"  >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Archive (tar.gz on Unix, zip on Windows).
      # -----------------------------------------------------------------
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar -czf "${{ steps.stage.outputs.name }}.tar.gz" "${{ steps.stage.outputs.name }}"
          shasum -a 256 "${{ steps.stage.outputs.name }}.tar.gz" > "${{ steps.stage.outputs.name }}.tar.gz.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "${{ steps.stage.outputs.name }}"
          Set-Location dist
          Compress-Archive -Path "$name" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            dist/${{ steps.stage.outputs.name }}.${{ matrix.archive }}
            dist/${{ steps.stage.outputs.name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # =====================================================================
  # Aggregate + publish to GitHub Release.
  # =====================================================================
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        shell: bash
        run: |
          cd dist
          # Concatenate every per-archive .sha256 into a single SHA256SUMS file
          # for one-shot verification: `shasum -a 256 -c SHA256SUMS`.
          : > SHA256SUMS
          for f in *.sha256; do
            cat "${f}" >> SHA256SUMS
          done
          # Remove the individual .sha256 files (avoid duplicating in the release).
          rm -f *.sha256
          ls -la

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false   # auto-publish on tag push
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
